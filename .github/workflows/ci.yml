# CI: lint, tests (Postgres + Redis reales), build de la SPA, smoke test, imagen Docker,
# contrato Soroban y auditoría de dependencias. Sin despliegues ni secretos.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests (unit + integration) & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: luminary
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: luminary_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U luminary" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://luminary:ci-only-password@127.0.0.1:5432/luminary_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vitest with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Smoke test against a running API
        env:
          DATABASE_URL: postgres://luminary:ci-only-password@127.0.0.1:5432/luminary_test
          REDIS_URL: redis://127.0.0.1:6379/2
          VERIFY_STELLAR_TX: 'false'
          PORT: '4000'
        run: |
          JWT_SECRET="$(openssl rand -hex 48)"
          export JWT_SECRET
          npm run db:migrate
          npm run db:migrate   # idempotente: la segunda pasada no aplica nada
          node server/index.js > api.log 2>&1 &
          API_PID=$!
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4000/api/health/ready && break; sleep 1; done
          API_URL=http://127.0.0.1:4000 npm run test:smoke
          kill -TERM "$API_PID"
          wait "$API_PID"   # apagado ordenado: debe salir con 0
      - name: API log
        if: always()
        run: cat api.log || true

  build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle sizes
        run: du -b dist/assets/* | sort -n | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: luminary-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image refuses insecure production config
        run: |
          if docker run --rm -e NODE_ENV=production -e JWT_SECRET=short luminary-api:ci; then
            echo "expected the container to exit non-zero" && exit 1
          fi

  contract:
    name: Soroban contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contract-luminary
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract-luminary
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - uses: stellar/stellar-cli@v30.0.1
      - name: Build WASM
        run: |
          stellar contract build
          du -b target/wasm32v1-none/release/*.wasm | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: contract-luminary/target/wasm32v1-none/release/*.wasm
          retention-days: 14

  audit:
    name: npm audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low | tee -a "$GITHUB_STEP_SUMMARY"
